# Netlify'a özel yapılandırma.
#
# Bu kural eskiden public/_redirects dosyasındaydı, ama Cloudflare Workers
# o dosyayı da okuyup "/* /index.html 200" kuralını sonsuz döngü sayarak
# deploy'u reddediyor (Cloudflare .html uzantısını kendiliğinden kırpıyor,
# kural kendini tetikliyor).
#
# Cloudflare tarafında aynı işi wrangler.jsonc'deki
# "not_found_handling": "single-page-application" görüyor.
# netlify.toml'u ise Cloudflare görmezden geliyor — ikisi çakışmıyor.
#
# Netlify kapatılınca bu dosya silinebilir.

[build]
  command = "npm run build"
  publish = "dist"

# Tek sayfa uygulaması: /guide, /videos gibi adresler diskte dosya olarak
# yok, React Router çözüyor. Bilinmeyen yolları index.html'e ver.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
