# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# GitHub repository: content is committed directly here
backend:
  name: github
  repo: altindaselif/mafin-archive
  branch: main
  # GitHub girişi için kendi kimlik doğrulama aracımız.
  #
  # Sveltia varsayılan olarak Netlify'ın OAuth servisini kullanıyor; site
  # Netlify'dan Cloudflare Workers'a taşınınca o servis siteyi tanımayıp
  # "Not Found" vermeye başladı. Bu adres kendi hesabımızdaki
  # sveltia-cms-auth Worker'ı — GitHub OAuth uygulamasının kimlik
  # bilgileri orada şifreli duruyor, burada değil.
  base_url: https://sveltia-cms-auth.universomafin.workers.dev

# Where images live (galleries, posters, actress photos)
media_folder: public/img
public_folder: /img

# 4K bölüm fotoğrafları GitHub'a değil, Cloudflare R2'ye yüklenir.
# Secret Access Key BURAYA yazılmaz — editör CMS'te ilk kez bir foto
# eklerken bir kez girer, tarayıcısında güvenle saklanır.
media_libraries:
  # Depo (git) deposunu seçenek olmaktan çıkar. Açık bırakılırsa yükleme
  # penceresinde "Global Assets" görünüyor ve yanlışlıkla seçilince 4K
  # fotoğraf git'e giriyor (iki kez oldu, 7.4 MB'lık PNG), üstelik kayda
  # `/img/...` yolu yazılıyor — Gallery.jsx onu R2 adresi sanıp bozuk
  # bağlantı üretiyor. Alan bazında `media_library: cloudflare_r2` yazmak
  # yetmedi; kapatılması gereken şey varsayılanın kendisiymiş.
  default: false

  # Stok fotoğraf servisleri (Picsum, Pexels, Pixabay, Unsplash) bu arşivde
  # işe yaramıyor — kapalı. Galerideki örnek veriler zaten Picsum'dan
  # gelmişti, kazara tekrar olmasın.
  stock_assets: false

  # Fotoğraflar ORİJİNAL haliyle (tam 4K, hiç küçültülmeden) R2'ye yüklenir.
  #
  # access_key_id herkese açık (bu dosya /admin/config.yml adresinden
  # okunabiliyor) ama tek başına hiçbir kapı açmıyor — secret olmadan
  # kullanılamaz, secret da editörün tarayıcısında duruyor, burada değil.
  #
  # Yine de bu anahtar "mafin-cms-photos" token'ına ait ve YALNIZCA
  # mafin-photos bucket'ına yazabiliyor. Eskiden burada tüm bucket'lara
  # yetkili bir token vardı; secret sızsaydı video bucket'ı da gidiyordu.
  cloudflare_r2:
    access_key_id: 95647f01a95e417b62ad8e45cedce548
    bucket: mafin-photos
    account_id: 21d9a10b9e439b63b16c4f24890356d3
    # CMS'in önizleme resimlerini çektiği adres. r2.dev'e YÖNLENDİRMİYORUZ:
    # o adres Cloudflare'in hız sınırlı geliştirme adresi ve buradan hiç
    # açılmıyor (bağlantı bile kurulmuyor), önizlemeler bu yüzden boş
    # geliyordu. Kendi Worker'ımız aynı dosyaları R2 bağlantısıyla sunuyor.
    public_url: https://archivo.universomafin.workers.dev/media/photos

collections:
  # ── Episodes: each one its own file under src/data/episodes/ ──
  - name: episodes
    label: Episodes
    label_singular: Episode
    folder: src/data/episodes
    extension: json
    format: json
    identifier_field: number
    summary: "Episode {{fields.number}} — {{fields.title.en}}"
    sortable_fields: [number, airDate]
    create: true
    slug: "e{{fields.number}}"
    fields:
      # id auto: "e" + episode number (editors never touch it)
      - { label: ID, name: id, widget: compute, value: "e{{fields.number}}" }
      - { label: Episode number, name: number, widget: number, value_type: int, min: 1, hint: "Only the number — 559, not 'Episode 559'" }
      - label: Title
        name: title
        widget: object
        fields:
          - { label: Spanish, name: es, widget: string, required: false }
          - { label: English, name: en, widget: string, required: false }
      - label: Moods
        name: moods
        widget: select
        multiple: true
        required: false
        options: [iconic, argue, hug, kiss, baby, miento, cloe]
      - label: Description
        name: description
        widget: object
        fields:
          - { label: Spanish, name: es, widget: text, required: false }
          - { label: English, name: en, widget: text, required: false }
      # İşaretlenirse ana sayfadaki "tal día como hoy" bu bölümü atlar.
      # Marta ve Fina'nın geçmediği bölümler için: başlığa "Sin Mafin"
      # ya da "Sin Marta" yaz, açıklamayı boş bırak, bunu işaretle.
      - { label: "No Mafin", name: noMafin, widget: boolean, required: false, default: false, hint: "Tick this when Marta and Fina do not appear at all. Those episodes are skipped by the 'on this day' box on the home page" }
      # Boş bırakılabilir: `npm run sync:dates` tarihleri TVMaze'den
      # çekip dolduruyor. Elle girmek de serbest, script dolu alanların
      # üzerine yazmıyor — ama çelişirse uyarıyor.
      - label: Air date
        name: airDate
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD/MM/YYYY
        time_format: false
        required: false
        hint: "Leave this blank — the air date is filled in automatically from TVMaze"

  # ── Galleries: her kayıt bir bölümün foto albümü, fotolar R2'ye gider ──
  - name: gallery
    label: Galleries
    label_singular: Gallery
    folder: src/data/gallery
    extension: json
    format: json
    identifier_field: episode
    summary: "Episode #{{fields.episode}}"
    sortable_fields: [episode]
    create: true
    slug: "g{{fields.episode}}"
    fields:
      - { label: Episode number, name: episode, widget: number, value_type: int, min: 1, hint: "Only the number — 559, not 'Episode 559'" }
      - label: Photos
        name: photos
        widget: image
        multiple: true
        required: false

  # ── Fandom: hayranların gönderdiği eserler ──
  #
  # Formdan gelen her aportación buraya `approved: false` olarak düşer.
  # Sen okur, uygunsa "Yayında" kutusunu işaretlersin — site kendiliğinden
  # güncellenir. İşaretlemediğin sürece kimse göremez.
  #
  # Sıralamayı "Onay bekleyenler" filtresiyle görmek için: üstteki
  # sortable_fields'tan `approved`i seç.
  - name: fandom
    label: Fandom
    label_singular: Submission
    folder: src/data/fandom
    extension: json
    format: json
    identifier_field: title
    summary: "{{fields.date | date('DD/MM/YYYY')}} — {{fields.title}} — {{fields.author}}"
    sortable_fields: [approved, date]
    create: true
    # Dosya adını CMS üretiyor; formdan gelenleri worker aynı kalıpta yazıyor.
    # Sıralama tarihe göre, elle numara yok.
    slug: "f{{fields.date | date('DD-MM-YYYY')}}-{{uuid_shorter}}"
    fields:
      - label: Type
        name: type
        widget: select
        options: ["Canción", "Fanfic", "Arte"]
        hint: "The kind of work. These values are shown translated on the site"
      - { label: Title, name: title, widget: string, hint: "The name of the work itself — 'Perfume de lavanda'" }
      - { label: Author, name: author, widget: string, hint: "Name or handle — '@martafina_edits'" }
      - { label: Link, name: url, widget: string, pattern: ['^https?://', "Must start with https://"], hint: "Full link to where the work is published" }
      - { label: Note, name: note, widget: text, required: false, hint: "One line about the work, shown in quotes next to the author" }
      # `widget: date` Sveltia'da kaldırıldı; Prensa koleksiyonuyla aynı kalıp.
      - { label: Date, name: date, widget: datetime, format: YYYY-MM-DD, date_format: DD/MM/YYYY, time_format: false, hint: "When it reached the archive. Filled in automatically for form submissions" }
      # Bu kutu işaretlenmeden eser sitede GÖRÜNMEZ. Formdan gelenler
      # her zaman işaretsiz gelir.
      - { label: Published, name: approved, widget: boolean, default: false, hint: "Nothing appears on the site until you tick this" }

  # ── Quotes: each quote its own file under src/data/quotes/ ──
  - name: quotes
    label: Quotes
    label_singular: Quote
    folder: src/data/quotes
    extension: json
    format: json
    identifier_field: episode
    summary: "Episode {{fields.episode}} — {{fields.speaker}}"
    sortable_fields:
      fields: [episode]
      default: { field: episode, direction: ascending }
    create: true
    # Dosya adını CMS üretiyor: bölüm + 8 karakterlik rastgele kimlik.
    # Elle numara yazılmıyor. Alıntılar sitede yalnızca bölüme göre
    # sıralanıyor; aynı bölümdekilerin kendi arasındaki sırası önemsiz.
    slug: "q{{fields.episode}}-{{uuid_shorter}}"
    fields:
      - { label: Episode, name: episode, widget: number, value_type: int, min: 1, hint: "Only the number — 559, not 'Episode 559'" }
      - label: Speaker
        name: speaker
        widget: select
        options: ["Marta", "Fina", "Mafin"]
        hint: "Who says it. Pick 'Mafin' when it is a back-and-forth between the two — then write the text as 'Marta: … Fina: … Marta: …'"
      - label: Text
        name: text
        widget: object
        fields:
          - { label: Spanish, name: es, widget: text }
          - { label: English, name: en, widget: text }

  # ── Timeline: each milestone its own file under src/data/timeline/ ──
  - name: timeline
    label: Timeline
    label_singular: Milestone
    folder: src/data/timeline
    extension: json
    format: json
    identifier_field: episode
    summary: "Episode {{fields.episode}} — {{fields.title.en}}"
    sortable_fields: [episode]
    create: true
    # Dosya adını CMS üretiyor. Sıralama bölüme göre, elle numara yok:
    # sonradan eklenen bir taş kendi kronolojik yerine oturuyor.
    slug: "m{{fields.episode}}-{{uuid_shorter}}"
    fields:
      - { label: Episode, name: episode, widget: number, value_type: int, min: 1, hint: "Only the number — 559, not 'Episode 559'. The milestones are ordered by this" }
      - { label: Video file, name: video, widget: compute, value: "timeline-ep{{fields.episode}}.mp4", hint: "Filled in automatically. The clip must already be uploaded to R2 under timeline/ with this exact name" }
      - label: Title
        name: title
        widget: object
        fields:
          - { label: Spanish, name: es, widget: string }
          - { label: English, name: en, widget: string }
      - label: Text
        name: text
        widget: object
        fields:
          - { label: Spanish, name: es, widget: text }
          - { label: English, name: en, widget: text }

  # ── Characters ──
  - name: characters
    label: Characters
    label_singular: Character
    folder: src/data/characters
    extension: json
    format: json
    identifier_field: number
    summary: "#{{fields.number}} — {{fields.name}}"
    sortable_fields: [number]
    create: true
    slug: "c{{fields.number}}"
    fields:
      - { label: Display order, name: number, widget: number, value_type: int, min: 1, hint: "Where the character sits on the page — family first, then shop, then the rest. A new one normally goes at the end: last number + 1" }
      - { label: ID, name: id, widget: compute, value: "c{{fields.number}}" }
      - { label: Name, name: name, widget: string }
      - label: Role
        name: role
        widget: object
        fields:
          - { label: Spanish, name: es, widget: string }
          - { label: English, name: en, widget: string }
      - label: Bio
        name: bio
        widget: object
        fields:
          - { label: Spanish, name: es, widget: text }
          - { label: English, name: en, widget: text }
      - { label: Group, name: group, widget: select, options: [family, shop, thirds] }

  # ── Press ──
  - name: press
    label: Press
    label_singular: Press item
    folder: src/data/press
    extension: json
    format: json
    identifier_field: outlet
    summary: "{{fields.date | date('DD/MM/YYYY')}} — {{fields.outlet}}"
    sortable_fields: [date]
    create: true
    # Dosya adını CMS üretiyor. Sıralama tarihe göre, elle numara yok.
    slug: "p{{fields.date | date('DD-MM-YYYY')}}-{{uuid_shorter}}"
    fields:
      - { label: Outlet, name: outlet, widget: string, hint: "Name of the publication — Fotogramas, El País…" }
      - { label: Date, name: date, widget: datetime, format: YYYY-MM-DD, date_format: DD/MM/YYYY, time_format: false }
      - label: Title
        name: title
        widget: object
        fields:
          - { label: Spanish, name: es, widget: string }
          - { label: English, name: en, widget: string }
      - { label: URL, name: url, widget: string, hint: "Full link to the article, starting with https://" }
