  <body>
    <!-- Mafin duotone: maps image luminance to the #722f37 ramp (same math as
         the old baked "V2"). Referenced from .page::after via filter:url(#mafin-duo). -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="mafin-duo" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="
          0.299 0.587 0.114 0 0
          0.299 0.587 0.114 0 0
          0.299 0.587 0.114 0 0
          0     0     0     1 0"/>
        <feComponentTransfer>
          <feFuncR type="table" tableValues="0.156 0.559"/>
          <feFuncG type="table" tableValues="0.065 0.230"/>
          <feFuncB type="table" tableValues="0.075 0.270"/>
          <feFuncA type="identity"/>
        </feComponentTransfer>
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
