<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archivo Mafin</title>

    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Mafin duotone: maps image luminance to the #722f37 ramp (same math as
         the old baked "V2"). Referenced from .page::after via filter:url(#mafin-duo). -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="mafin-duo" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="
          0.299 0.587 0.114 0 0
          0.299 0.587 0.114 0 0
          0.299 0.587 0.114 0 0
          0     0     0     1 0"/>
        <feComponentTransfer>
          <feFuncR type="table" tableValues="0.156 0.559"/>
          <feFuncG type="table" tableValues="0.065 0.230"/>
          <feFuncB type="table" tableValues="0.075 0.270"/>
          <feFuncA type="identity"/>
        </feComponentTransfer>
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
